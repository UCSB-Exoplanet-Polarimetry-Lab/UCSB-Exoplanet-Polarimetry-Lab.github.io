title: Circumstellar Disk Morphology and Composition
nav: science
show_title: true
back: {href: science.html, label: Science}
description: "Debris disk studies with the Gemini Planet Imager and JWST, including water ice in HD 141569A."
blocks:
  - type: heading
    text: Debris Disks with GPI
  - type: text
    html: >-
      During my PhD I led two observational studies of debris disks, based on data from the Gemini Planet
      Imager's polarimetry mode. Because the disk-scattered light is polarized and the direct starlight is
      not, GPI's polarimetry mode can reject the unpolarized starlight to reveal a polarized disk beneath,
      a technique known as polarimetric differential imaging (PDI). In my first study I used PDI to image
      the debris disk of Beta Pictoris, as well as the directly imaged planet.
  - type: figure
    src: images/betapic.png
    width: 540px
    caption: >-
      In this GPI image of the disk we see an image of the nearly edge-on disk in polarized intensity, where the dust from the disk
      is extremely forward-scattering. Also overlaid on top is an image of the directly imaged planet Beta
      Pictoris b, seen in total intensity in the same dataset. In this study we found that the morphology of the disk
      could not be completely explained by the known directly imaged planet, suggesting that there could be another
      unseen planet in the system perturbing the disk. Link:
      <a href="https://ui.adsabs.harvard.edu/abs/2015ApJ...811...18M/abstract">Millar-Blanchaer et al. 2015.</a>
  - type: text
    html: >-
      In a second study, I looked at the morphology of the disk around HD 157587 and demonstrated that subtle
      asymmetries in the disk brightness distribution could be explained by a stellocentric offset. This offset
      could be well explained by an unseen planet on an eccentric orbit.
  - type: figure
    src: images/HD157.png
    width: 320px
    caption: >-
      In this image of the HD 157587 debris disk, the lower left side of the disk is slightly brighter than the
      upper right side of the disk, suggesting a stellocentric offset, possibly caused by an unseen planet. Link:
      <a href="https://ui.adsabs.harvard.edu/abs/2016AJ....152..128M/abstract">Millar-Blanchaer et al. 2016.</a>
  - type: heading
    text: Debris Disk Composition with JWST
    tag: new
  - type: figure
    src: images/JWST.jpg
    width: 720px
    caption: ""
  - type: text
    html: >-
      The James Webb Space Telescope (JWST) launched on Christmas day 2021 and is able to offer new direct imaging
      capabilities beyond what is currently available on the ground. JWST's coronagraphic modes
      allow us to explore wavelength regimes inaccessible from the ground (such as water and ice
      spectroscopic features), and provide direct-imaging detection limits down to Saturn-mass planets
      around the nearest stars. In 2017, I took on the role of co-Lead of the debris disk component of
      a now-accepted JWST Early Release Science proposal (PI: Sasha Hinkley). In this program, we have
      obtained observations of both a directly imaged exoplanet and a debris disk in order to demonstrate
      the instrument's capabilities while delivering new and exciting science. You can see an ADS library of
      papers from this program <a href="https://ui.adsabs.harvard.edu/public-libraries/ROyK-8T0RQS07K_MoK3vBA">here.</a>
  - type: text
    html: >-
      The debris disk component, which accounts for roughly one third of the total awarded ~40 hours, imaged the HD 141569A
      disk in scattered light with the NIRCam instrument to search for signs of water ice in the disk, and in thermal emission
      with the MIRI instrument at wavelengths inaccessible from the ground. The NIRCam observations were obtained in February 2023, and the results are now
      <a href="https://ui.adsabs.harvard.edu/abs/2025ApJ...994..199M/abstract">published</a>: the first detection of water ice in the HD 141569A system,
      along with an unexpected radial gradient in the dust properties. It was a huge team effort, so thanks to everyone involved!
  - type: figure
    src: images/jwst_hd141569A.jpg
    width: 520px
    caption: "JWST image of the HD 141569A transition disk from Millar-Blanchaer et al. 2025."
