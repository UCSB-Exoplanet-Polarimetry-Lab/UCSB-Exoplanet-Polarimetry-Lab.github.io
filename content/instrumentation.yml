title: Instrumentation
nav: instrumentation
description: "Astronomical instrumentation: polarimetric modes for GPI, WIRC+Pol, Keck NIRC2, metasurface optics and the Roman Coronagraph."
blocks:
  - type: text
    html: >-
      With a BSc in Electrical Engineering and a BSc in Physics, I have always found astronomical instrumentation
      to be a perfect match to my interests and training. In general my current instrumentation focus is on the
      development and implementation of new polarimetric modes for the characterization of exoplanets and debris
      disks, but I'm also interested in non-polarimetric instrumentation and techniques for direct imaging of exoplanets and debris disks.
      In the pages below, I give some more examples of my current and past instrumentation projects.
  - type: text
    html: >-
      In addition to the projects below I am also currently working on implementing a new polarimetry mode for the Keck NIRC2 infrared imager,
      characterizing the Subaru/SCExAO/VAMPIRES polarimetry mode
      <a href="https://www.spiedigitallibrary.org/conference-proceedings-of-spie/12680/2677599/Characterizing-the-instrumental-polarization-of-SCExAO-VAMPIRES/10.1117/12.2677599.short">(see this paper by my student Rebecca Zhang)</a>
      and planning for direct imaging instrumentation for thirty-meter class telescopes
      <a href="https://ui.adsabs.harvard.edu/abs/2023SPIE12680E..1XV/abstract">(see this paper by my student Connor Vancil on PSISIM)</a>.
      Most recently I've joined the Roman Coronagraph Instrument project and am co-leading the Data Reduction and Simulations working group.
