title: Metasurface Optics
nav: instrumentation
show_title: true
tag: hot
back: {href: instrumentation.html, label: Instrumentation}
description: "Metasurface optics for high-contrast imaging: focal-plane and pupil-plane coronagraphs."
blocks:
  - type: text
    html: >-
      Metasurface optics have drawn significant interest over the last several years due to their unique ability to precisely control various properties of incident light.
      Metasurfaces are arrays of subwavelength nanostructures spatially distributed across a thin substrate.
      The nanostructures can be periodic, and can have relatively arbitrary geometry within the constraints
      of nanofabrication processes. The material properties, as well as the exact shape and pattern of the
      structures determine the optical effects on incident wavefronts. By appropriately designing specific
      nanostructures, metasurfaces have been demonstrated that can manipulate phase, amplitude, and polarization.
  - type: figure
    src: images/metavort_SEM_MMBwebsite.png
